name: Game checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=/SPACE-DEFENDERS-21st-Century/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: smoke-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/production-smoke/
          retention-days: 7
  custom-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/
      - run: node scripts/check-static-hosting.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          SMOKE_BASE_PATH: /
      - name: Package verified custom-domain build
        working-directory: dist
        run: zip -r ../space-defenders-custom-domain.zip .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: space-defenders-custom-domain
          path: space-defenders-custom-domain.zip
          if-no-files-found: error
          retention-days: 7
